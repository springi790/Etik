name: Build Etik Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - "app-data.js"
      - "enhancements.js"
      - "platform-fixes.js"
      - "boot.js"
      - "templates.js"
      - "history.js"
      - "index.html"
      - "android-update.json"
      - "assets/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

concurrency:
  group: etik-android-debug-signing
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore persistent Etik debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: etik-android-debug-keystore-v2

      - name: Ensure persistent Etik debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Etik,C=MX" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Install Android target dependencies
        working-directory: mobile
        run: npm install

      - name: Prepare Etik web bundle
        working-directory: mobile
        run: npm run web:prepare

      - name: Create and sync Capacitor Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Etik launcher and splash assets
        working-directory: mobile
        run: |
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Patch Android native integration
        working-directory: mobile
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Etik-Android.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Etik-Android-debug-alpha5
          path: ${{ runner.temp }}/Etik-Android.apk
          if-no-files-found: error

      - name: Publish OTA APK branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          APK_BLOB=$(git hash-object -w "$RUNNER_TEMP/Etik-Android.apk")
          MANIFEST_BLOB=$(git hash-object -w android-update.json)
          TREE=$(printf '100644 blob %s\tEtik-Android.apk\n100644 blob %s\tandroid-update.json\n' "$APK_BLOB" "$MANIFEST_BLOB" | git mktree)
          VERSION=$(node -p "require('./mobile/package.json').version")
          COMMIT=$(printf 'Etik Android %s OTA\n' "$VERSION" | git commit-tree "$TREE")
          git push --force origin "$COMMIT:refs/heads/android-updates"
