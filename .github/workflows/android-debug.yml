name: Build Etik Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - "app-data.js"
      - "enhancements.js"
      - "platform-fixes.js"
      - "boot.js"
      - "templates.js"
      - "history.js"
      - "index.html"
      - "assets/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

# Solo una compilación Android a la vez. Esto evita que dos runners creen
# simultáneamente firmas de depuración distintas cuando el caché aún no existe.
concurrency:
  group: etik-android-debug-signing
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle genera ~/.android/debug.keystore automáticamente. Guardamos ese
      # archivo entre ejecuciones para que todas las alphas futuras tengan la
      # misma firma y Android permita instalarlas como actualización.
      - name: Restore persistent Etik debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: etik-android-debug-keystore-v1

      - name: Install Android target dependencies
        working-directory: mobile
        run: npm install

      - name: Prepare Etik web bundle
        working-directory: mobile
        run: npm run web:prepare

      - name: Create and sync Capacitor Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Etik launcher and splash assets
        working-directory: mobile
        run: |
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Etik-Android-debug-alpha4
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
