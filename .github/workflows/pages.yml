name: Deploy Etik to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare browser assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          assets = {
              'css-data.js': ('__etikCssGzip', 'styles.css'),
              'app-data.js': ('__etikAppGzip', 'app.js'),
          }

          for source, (var_name, target) in assets.items():
              text = Path(source).read_text(encoding='utf-8')
              match = re.search(r'=\s*["\'](.+?)["\'];?\s*$', text, re.S)
              if not match:
                  raise SystemExit(f'No se pudo leer {var_name} desde {source}')
              decoded = gzip.decompress(base64.b64decode(match.group(1)))
              Path(target).write_bytes(decoded)
          PY

          npm install --no-save qrcode@1.5.4 browserify@17
          npx browserify node_modules/qrcode/lib/browser.js --standalone QRCode -o qr-engine.js
          rm -rf node_modules package-lock.json package.json

          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          old = '\n'.join([
              '<script src="qr-data.js"></script>',
              '<script src="css-data.js"></script>',
              '<script src="app-data.js"></script>',
              '<script src="boot.js"></script>',
          ])
          new = '<script src="boot.js?v=19"></script>'
          if old not in html:
              raise SystemExit('No se encontró el bloque antiguo de arranque en index.html')
          html = html.replace(old, new)

          branding = '\n'.join([
              '<link rel="icon" href="assets/icon-192.png?v=19" sizes="192x192" type="image/png">',
              '<link rel="apple-touch-icon" href="assets/icon-192.png?v=19">',
              '<link rel="manifest" href="manifest.webmanifest?v=19">',
              '<meta name="theme-color" content="#1265d6">',
              '<meta name="application-name" content="Etik">',
              '<meta name="apple-mobile-web-app-title" content="Etik">',
          ])
          if 'rel="manifest"' not in html:
              html = html.replace('</head>', branding + '\n</head>')

          old_brand = '<div class="brand-mark">E</div>'
          new_brand = '<div class="brand-mark"><img src="assets/icon-192.png?v=19" alt="" style="width:100%;height:100%;object-fit:contain;display:block"></div>'
          if old_brand in html:
              html = html.replace(old_brand, new_brand, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
