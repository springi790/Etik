name: Deploy Etik to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare browser assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          assets = {
              'css-data.js': ('__etikCssGzip', 'styles.css'),
              'app-data.js': ('__etikAppGzip', 'app.js'),
          }

          for source, (var_name, target) in assets.items():
              text = Path(source).read_text(encoding='utf-8')
              match = re.search(r'=\s*["\'](.+?)["\'];?\s*$', text, re.S)
              if not match:
                  raise SystemExit(f'No se pudo leer {var_name} desde {source}')
              decoded = gzip.decompress(base64.b64decode(match.group(1)))
              Path(target).write_bytes(decoded)
          PY

          npm install --no-save qrcode@1.5.4 browserify@17
          npx browserify node_modules/qrcode/lib/browser.js --standalone QRCode -o qr-engine.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
